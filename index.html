<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script type="module" src="home.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="icon" href="" type="image/png" />
    <title>Quiz Challenges Platform</title>
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <section id="home">
      <nav id="topNavbar">
        <div id="toolsContainer">
          <button class="tools">
            <p class="text">Study tools</p>
            <img src="assets/icons/home/arrow.png" alt="arrow" width="20px" />
          </button>
          <button class="tools">
            <p class="text">Matters</p>
            <img src="assets/icons/home/arrow.png" alt="arrow" width="20px" />
          </button>
        </div>
        <div id="searchbarContainer">
          <search id="searchbar">
            <img
              src="assets/icons/home/magnifier.png"
              alt="magnifier"
              width="18px"
            />
            <form action="/search" method="get"></form>
            <input
              type="search"
              id="searchbarInput"
              placeholder="Search here!"
            />
          </search>
        </div>
        <div id="loginButtons">
          <button class="login" id="loginButton">Login</button>
          <button class="login" id="signupButton">Sign up</button>
        </div>
      </nav>

      <main id="main">
        <div id="mainContent">
          <div id="mainText">
            <h1 class="text" id="mainTitle">
              What would you like to challenge yourself with today?
            </h1>
            <p class="text" id="mainParagraph">
              Choose a topic, test your knowledge, and learn something new along
              the way.
            </p>
          </div>
          <button class="login" id="signupButton2">Sign up for free</button>
        </div>
        <div id="cards">
          <div class="card" id="card1">
            <span class="number" id="n1">01</span>
            <h2>CARDS</h2>
            <p class="text" id="cardDescription"></p>
            <img src="" alt="" width="330px" />
            <div>
              <div>
                <img src="" alt="" />
                <p></p>
              </div>
              <div>
                <img src="" alt="" />
                <p></p>
              </div>
              <div>
                <img src="" alt="" />
                <p></p>
              </div>
            </div>
          </div>

          <div class="card" id="card2">
            <span class="number" id="n2">02</span>
            <h2>QUIZ</h2>
          </div>
          <div class="card" id="card3">
            <span class="number" id="n3">03</span>
            <h2>CHALLENGE</h2>
          </div>
          <div class="card" id="card4">
            <span class="number" id="n4">04</span>
            <h2>PRACTICE</h2>
          </div>
        </div>
        <section id="informations">
          <div id="informationsTitleContainer">
            <h1 class="text" id="informationsTitle">
              A platform built to challenge your skills and accelerate your
              learning.
            </h1>
          </div>
        </section>
      </main>
    </section>
  </body>
</html>
